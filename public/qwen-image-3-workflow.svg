    <text x="26" y="35" fill="#a78bfa" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="2">03 · GENERATE</text>
    <text x="26" y="76" fill="#f2f2ef" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="600">Generate privately</text>
    <text x="26" y="103" fill="#858684" font-family="Inter,Arial,sans-serif" font-size="16">Refine, save, or export</text>
  </g>
  <text x="74" y="565" fill="#747573" font-family="Inter,Arial,sans-serif" font-size="16">qwen-image-3.net · Independent third-party product</text>
