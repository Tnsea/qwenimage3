    <text x="26" y="35" fill="#a78bfa" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="2">01 · DESCRIBE</text>
    <text x="26" y="76" fill="#f2f2ef" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="600">Shape the image</text>
    <text x="26" y="103" fill="#858684" font-family="Inter,Arial,sans-serif" font-size="16">Subject, scene, and style</text>
    <path d="M316 64h42" stroke="#6d28d9" stroke-width="3" stroke-linecap="round"/>
    <path d="m350 57 8 7-8 7" fill="none" stroke="#6d28d9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g transform="translate(432 370)">
    <rect width="300" height="128" rx="22" fill="#101213" stroke="#343638"/>
    <text x="26" y="35" fill="#a78bfa" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="2">02 · CHOOSE</text>
    <text x="26" y="76" fill="#f2f2ef" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="600">Select the model</text>
    <text x="26" y="103" fill="#858684" font-family="Inter,Arial,sans-serif" font-size="16">Format, quality, and cost</text>
    <path d="M316 64h42" stroke="#6d28d9" stroke-width="3" stroke-linecap="round"/>
    <path d="m350 57 8 7-8 7" fill="none" stroke="#6d28d9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g transform="translate(790 370)">
